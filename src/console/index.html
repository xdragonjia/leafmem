<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LeafMem Console</title>
<style>
  :root{
    --bg:#f5f7fa; --card:#ffffff; --ink:#1a2332; --ink2:#5b6675; --line:#e5e9f0;
    --brand:#16a34a; --brand2:#15803d; --accent:#65a30d;
    --ok:#16a34a; --warn:#d97706; --err:#dc2626; --purple:#7c3aed;
    --radius:14px; --shadow:0 1px 3px rgba(16,24,40,.07),0 4px 14px rgba(16,24,40,.06);
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.6;font-size:14px;display:flex;height:100vh;overflow:hidden}
  a{color:var(--brand);text-decoration:none}

  /* ===== 侧边栏 ===== */
  .side{width:216px;background:#0f1b2d;color:#cdd6e4;flex-shrink:0;display:flex;flex-direction:column;padding:18px 12px}
  .side .logo{display:flex;align-items:center;gap:10px;padding:6px 10px 18px;border-bottom:1px solid rgba(255,255,255,.08)}
  .side .logo .ic{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#16a34a,#65a30d);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 2px 10px rgba(22,163,74,.4)}
  .side .logo .ic svg{width:18px;height:18px}
  .side .logo .t b{color:#fff;font-size:15px;display:block;letter-spacing:.2px}
  .side .logo .t span{font-size:11px;color:#8ea0bd}
  .nav{margin-top:14px;display:flex;flex-direction:column;gap:2px}
  .nav .grp{font-size:11px;color:#6b7a96;padding:12px 12px 5px;letter-spacing:.08em}
  .nav button{display:flex;align-items:center;gap:11px;width:100%;padding:11px 12px;border:none;background:none;
    color:#b7c3d8;border-radius:10px;cursor:pointer;font-size:14px;text-align:left;min-height:44px;transition:.15s;font-family:inherit}
  .nav button svg{width:18px;height:18px;flex-shrink:0;opacity:.85}
  .nav button:hover{background:rgba(255,255,255,.06);color:#fff}
  .nav button.on{background:linear-gradient(90deg,rgba(22,163,74,.32),rgba(101,163,13,.16));color:#fff;font-weight:600}
  .side .foot{margin-top:auto;font-size:11px;color:#6b7a96;padding:10px;line-height:1.7}
  .side .foot .row{display:flex;align-items:center;gap:7px}
  .dot{width:8px;height:8px;border-radius:50%;background:#44536b;flex-shrink:0}
  .dot.on{background:#4ade80;box-shadow:0 0 8px rgba(74,222,128,.7)}
  .side .foot .mono{font-family:var(--mono);font-size:10.5px;color:#8ea0bd;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* ===== 主区 ===== */
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{display:flex;align-items:center;gap:12px;padding:16px 26px 0;flex-wrap:wrap}
  .topbar h1{font-size:20px;letter-spacing:.3px}
  .topbar .meta{font-size:12.5px;color:var(--ink2)}
  .topbar .spacer{flex:1}
  #page{flex:1;overflow-y:auto;padding:18px 26px 46px}
  .inner{max-width:1280px;margin:0 auto}

  /* ===== 控件 ===== */
  .btn{display:inline-flex;align-items:center;gap:6px;padding:9px 15px;border-radius:10px;border:1px solid var(--line);
    background:var(--card);color:var(--ink);font-size:13.5px;cursor:pointer;min-height:40px;transition:.15s;font-weight:500;font-family:inherit;white-space:nowrap}
  .btn:hover{border-color:var(--brand);color:var(--brand)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
  .btn.primary:hover{background:var(--brand2);color:#fff}
  .btn.danger{color:var(--err)}
  .btn.danger:hover{border-color:var(--err);color:var(--err);background:#fef2f2}
  .btn.sm{min-height:32px;padding:5px 12px;font-size:12.5px;border-radius:8px}
  .input{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:13.5px;
    color:var(--ink);outline:none;transition:.15s;font-family:inherit;min-height:40px}
  .input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(22,163,74,.14)}
  .input.sm{min-height:32px;padding:5px 10px;font-size:12.5px;border-radius:8px}
  .input.mono{font-family:var(--mono);font-size:12px}
  select.input{cursor:pointer}

  /* ===== 卡片 ===== */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:18px 20px;margin-bottom:16px}
  .card h3{font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
  .card h3 .sub{font-size:12px;color:var(--ink2);font-weight:400}
  .card.plain{padding:0}
  .card .head{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
  .card .head h3{margin:0}

  /* ===== KPI ===== */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
  .kpi .lbl{font-size:12.5px;color:var(--ink2);display:flex;align-items:center;gap:6px}
  .kpi .val{font-size:27px;font-weight:700;margin-top:5px;letter-spacing:.5px;font-variant-numeric:tabular-nums}
  .kpi .sub{font-size:12px;color:var(--ink2);margin-top:2px}
  .kpi.c1 .val{color:var(--brand)} .kpi.c2 .val{color:var(--ok)} .kpi.c3 .val{color:var(--purple)} .kpi.c4 .val{color:var(--accent)}

  .grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}
  .grid2 .card{margin-bottom:0}

  /* ===== 进度条 ===== */
  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
  .bar-row .lbl{width:86px;font-family:var(--mono);font-size:11.5px;color:var(--ink2);text-align:right;flex-shrink:0;overflow:hidden;text-overflow:ellipsis}
  .bar{flex:1;height:10px;background:#eef1f6;border-radius:20px;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:20px;background:linear-gradient(90deg,var(--brand),var(--accent))}
  .bar-row .num{width:44px;font-family:var(--mono);font-size:11.5px;color:var(--ink2)}

  /* ===== 表格 ===== */
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{padding:11px 16px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--ink2);font-weight:600;font-size:12px;background:#f8fafc}
  tr:last-child td{border-bottom:none}
  tbody tr{cursor:pointer;transition:background .1s}
  tbody tr:hover{background:#f6f9ff}
  .cell-preview{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.55}
  .mono-sm{font-family:var(--mono);font-size:11px;color:var(--ink2);white-space:nowrap}

  /* ===== 标签 ===== */
  .pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap}
  .pill.g{background:#dcfce7;color:#15803d}.pill.b{background:#dbeafe;color:#1d4ed8}
  .pill.y{background:#fef3c7;color:#b45309}.pill.p{background:#ede9fe;color:#6d28d9}
  .pill.gray{background:#eef1f6;color:var(--ink2)}.pill.r{background:#fee2e2;color:#b91c1c}
  .tags-row{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
  .tags-row .pill{font-weight:500;font-size:11px;background:#f1f5f9;color:#64748b}

  /* ===== 工具条 ===== */
  .toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .toolbar .spacer{flex:1}
  .search-wrap{position:relative;flex:1;min-width:220px;max-width:420px}
  .search-wrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:#94a3b8}
  .search-wrap .input{width:100%;padding-left:32px}
  .pager{display:flex;align-items:center;gap:6px}
  .pager .info{font-family:var(--mono);font-size:12px;color:var(--ink2);margin-right:2px}

  /* ===== 时间线 ===== */
  .tl{padding:6px 20px}
  .tl-item{display:flex;gap:14px;padding:10px 0;border-bottom:1px solid var(--line);align-items:baseline}
  .tl-item:last-child{border-bottom:none}
  .tl-time{font-family:var(--mono);font-size:11px;color:#94a3b8;width:64px;flex-shrink:0}
  .tl-type{width:96px;flex-shrink:0}
  .tl-data{font-family:var(--mono);font-size:11.5px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}

  /* ===== 召回 ===== */
  .hit{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 18px;margin-bottom:12px}
  .hit-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .hit-score{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--brand);width:56px}
  .hit-bar{flex:0 0 130px;height:6px;background:#eef1f6;border-radius:20px;overflow:hidden}
  .hit-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--accent))}
  .hit-summary{line-height:1.6}
  .hit-reasons{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
  .reason{font-family:var(--mono);font-size:10.5px;padding:2px 8px;border-radius:6px;background:#f1f5f9;color:#64748b}
  .reason.hot{background:#dbeafe;color:#1d4ed8;font-weight:600}

  /* ===== 宿主卡片 ===== */
  .infra{display:flex;gap:28px;align-items:center;flex-wrap:wrap}
  .infra .item .lbl{font-size:11.5px;color:var(--ink2);margin-bottom:3px}
  .infra .item .val{font-family:var(--mono);font-size:12px;color:var(--ink);word-break:break-all}
  .agent-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
  .agent-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;display:flex;flex-direction:column;gap:12px}
  .agent-head{display:flex;align-items:center;justify-content:space-between}
  .agent-name{font-weight:700;font-size:14px}
  .agent-scope{font-family:var(--mono);font-size:10.5px;color:#94a3b8;margin-top:2px}
  .agent-rows{display:flex;flex-direction:column;gap:7px}
  .agent-row{display:flex;justify-content:space-between;align-items:center;font-size:12.5px}
  .agent-row .lbl{color:var(--ink2)}
  .agent-path{font-family:var(--mono);font-size:10px;color:#94a3b8;word-break:break-all}
  .agent-actions{display:flex;gap:8px}
  .agent-actions .btn{flex:1;justify-content:center}

  /* ===== 抽屉 ===== */
  #drawer{position:fixed;top:0;right:0;bottom:0;width:500px;max-width:92vw;background:var(--card);
    border-left:1px solid var(--line);box-shadow:-8px 0 30px rgba(16,24,40,.12);transform:translateX(100%);
    transition:transform .22s ease;z-index:60;display:flex;flex-direction:column}
  #drawer.open{transform:translateX(0)}
  .dw-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
  .dw-head b{font-size:14.5px}
  .dw-body{flex:1;overflow-y:auto;padding:20px}
  .dw-sec{margin-bottom:18px}
  .dw-lbl{font-size:11.5px;font-weight:700;color:var(--ink2);margin-bottom:6px}
  .dw-text{font-size:13.5px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
  .dw-kv{display:grid;grid-template-columns:90px 1fr;gap:7px 12px;font-size:12.5px}
  .dw-kv .k{color:var(--ink2)}
  .dw-kv .v{font-family:var(--mono);font-size:11.5px;word-break:break-all}

  /* ===== 连接页 ===== */
  .hero{max-width:440px;margin:8vh auto 0;text-align:center}
  .hero .ic{width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,#16a34a,#65a30d);
    display:inline-flex;align-items:center;justify-content:center;box-shadow:0 8px 28px rgba(22,163,74,.35);margin-bottom:18px}
  .hero .ic svg{width:28px;height:28px}
  .hero h2{font-size:20px;letter-spacing:.3px}
  .hero p{color:var(--ink2);font-size:13.5px;margin:8px 0 22px;line-height:1.7}
  .hero .card{text-align:left}

  .empty{text-align:center;padding:52px 20px;color:#94a3b8}
  .empty .glyph{font-size:26px;margin-bottom:10px;opacity:.6}
  .loading{text-align:center;padding:40px;color:#94a3b8;font-size:13px}
  #toasts{position:fixed;bottom:22px;right:22px;z-index:100;display:flex;flex-direction:column;gap:8px}
  .toast{background:#1a2332;color:#fff;border-radius:10px;padding:11px 16px;font-size:13px;
    box-shadow:0 8px 24px rgba(16,24,40,.25);animation:tin .18s ease;max-width:380px}
  .toast.err{background:var(--err)}
  @keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  /* ===== 帮助文档 ===== */
  .doc-body{padding:8px 26px 26px;line-height:1.75;font-size:14px}
  .doc-body h1{font-size:24px;margin:18px 0 12px;padding-bottom:10px;border-bottom:2px solid var(--line)}
  .doc-body h2{font-size:19px;margin:26px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line);color:var(--brand2)}
  .doc-body h3{font-size:16px;margin:20px 0 10px}
  .doc-body h4{font-size:14.5px;margin:14px 0 8px}
  .doc-body p{margin:8px 0}
  .doc-body a{color:var(--brand)}
  .doc-body ul{margin:8px 0 8px 22px}
  .doc-body li{margin:4px 0}
  .doc-body blockquote{margin:10px 0;padding:8px 14px;border-left:4px solid var(--brand);background:#f0f9f4;border-radius:0 8px 8px 0;color:var(--ink2)}
  .doc-table{width:100%;border-collapse:collapse;font-size:13px;margin:10px 0}
  .doc-table th,.doc-table td{padding:8px 10px;border:1px solid var(--line);text-align:left}
  .doc-table th{background:#f8fafc;font-weight:600}
  .doc-code,.doc-mermaid{position:relative;margin:12px 0;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .doc-code pre,.doc-mermaid pre{margin:0;padding:12px 14px;background:#0f172a;color:#e2e8f0;font-family:var(--mono);font-size:12.5px;line-height:1.6;overflow-x:auto;white-space:pre}
  .doc-mermaid pre{background:#fffbe6;color:#5b4a12}
  .doc-code-lang{position:absolute;top:6px;right:10px;font-size:10.5px;color:#94a3b8;font-family:var(--mono);text-transform:uppercase}
  .doc-mermaid .doc-code-lang{color:#b45309}
  .doc-flash{animation:docflash 1.2s ease}
  mark.doc-hit{background:#fde047;color:#1a2332;padding:0 2px;border-radius:2px}
  mark.doc-hit.doc-hit-first{outline:2px solid #d97706;outline-offset:1px}
  @keyframes docflash{0%{background:#dcfce7}100%{background:transparent}}
  #docs-toc{display:flex;flex-direction:column;gap:2px}
  #docs-toc a{display:block;padding:6px 10px;border-radius:6px;font-size:12.5px;color:var(--ink2);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #docs-toc a:hover{background:#f1f5f9;color:var(--brand2)}
  #docs-toc a.doc-toc-l1{font-weight:700;color:var(--ink);margin-top:8px}
  #docs-toc a.doc-toc-l2{padding-left:22px}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#cfd8e3;border-radius:5px;border:2px solid transparent;background-clip:content-box}
  ::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body>

<aside class="side">
  <div class="logo">
    <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg></div>
    <div class="t"><b>LeafMem</b><span>记忆控制台</span></div>
  </div>
  <nav class="nav">
    <button class="on" data-page="dashboard" onclick="goPage('dashboard')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
      仪表盘
    </button>
    <button data-page="explorer" onclick="goPage('explorer')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>
      记忆浏览
    </button>
    <button data-page="tasks" onclick="goPage('tasks')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/></svg>
      任务上下文
    </button>
    <button data-page="insights" onclick="goPage('insights')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4"/><path d="m16.2 7.8 2.9-2.9"/><path d="M18 12h4"/><path d="m16.2 16.2 2.9 2.9"/><path d="M12 18v4"/><path d="m4.9 19.1 2.9-2.9"/><path d="M2 12h4"/><path d="m4.9 4.9 2.9 2.9"/></svg>
      洞察
    </button>
    <button data-page="graph" onclick="goPage('graph')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="6" r="2.5"/><circle cx="19" cy="6" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M7 7.5 10.5 16"/><path d="M17 7.5 13.5 16"/><path d="M7.5 6h9"/></svg>
      知识图谱
    </button>
    <button data-page="events" onclick="goPage('events')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>
      事件日志
    </button>
    <button data-page="recall" onclick="goPage('recall')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      召回检查
    </button>
    <button data-page="agents" onclick="goPage('agents')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"/><rect x="4" y="8" width="16" height="12" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg>
      宿主接入
    </button>
    <button data-page="docs" onclick="goPage('docs')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>
      帮助文档
    </button>
  </nav>
  <div class="foot">
    <div class="row"><span class="dot" id="conn-dot"></span><span id="conn-label">未连接</span></div>
    <div class="row"><span class="mono" id="conn-scope">—</span></div>
  </div>
</aside>

<div class="main">
  <div class="topbar">
    <h1 id="page-title">仪表盘</h1>
    <span class="meta" id="page-sub"></span>
    <div class="spacer"></div>
    <span class="meta" id="scope-label" style="display:none">范围</span>
    <select class="input sm" id="scope-select" style="display:none" onchange="setScope(this.value)"></select>
  </div>
  <div id="page"></div>
</div>

<div id="drawer">
  <div class="dw-head"><b id="drawer-title">记忆详情</b><button class="btn sm" onclick="closeDrawer()">关闭 ✕</button></div>
  <div class="dw-body" id="drawer-body"></div>
</div>
<div id="toasts"></div>

<script>
// ================================================================ 状态
const API_BASE = window.location.origin;
const _q = new URLSearchParams(window.location.search);
const state = {
  // 2026-08-10: local console auto-connects via server-injected key, no manual input.
  apiKey: window.__LEAFMEM_API_KEY__ || _q.get('apiKey') || localStorage.getItem('leafmem_api_key') || '',
  page: ['dashboard','explorer','recall','insights','events','graph','agents','docs','tasks'].includes(_q.get('page')) ? _q.get('page') : 'dashboard',
  connected: false,
  scope: _q.get('scope') || localStorage.getItem('leafmem_scope') || 'all',
  agentIds: [], scopeList: [],
  explorerCache: null, explorerCacheScope: null,
  explorerPage: 0, explorerQuery: '', explorerKind: '', explorerSource: '', tasksPage: 0,
  recallQuery: '', eventType: '', expandedPrincipleId: null,
  sharedMemory: true,
};
const PAGE_SIZE = 25;
const KIND_PILL = { note:'b', lesson:'y', decision:'p', principle:'g' };

// ================================================================ API
async function api(path, options = {}) {
  if (!state.apiKey) throw new Error('未提供 API Key');
  const res = await fetch(`${API_BASE}${path}`, {
    ...options,
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${state.apiKey}`, ...options.headers },
  });
  if (!res.ok) {
    let msg = `HTTP ${res.status}`;
    try { const b = await res.json(); if (b?.error) msg = b.error; } catch {}
    throw new Error(msg);
  }
  return res.json();
}
function scopeQuery() {
  const p = new URLSearchParams();
  if (state.scope === 'shared') p.set('view', 'shared');
  else if (state.scope === 'all' || !state.scope) p.set('scope', 'all');
  else p.set('scope', state.scope);
  return p.toString();
}
function scopeContext() {
  if (state.scope === 'all' || !state.scope) return { allScopes: true };
  if (state.scope === 'shared') return { agentIds: state.agentIds.length ? state.agentIds : undefined, userId: '*' };
  if (state.scope && state.scope.includes(':')) {
    const [t, ...rest] = state.scope.split(':');
    return { anyScope: { type: t, id: rest.join(':') } };
  }
  return {};
}
const SCOPE_LABEL = { all: '全部记忆', shared: '共享记忆库（全部宿主+用户级）' };
const SCOPE_TYPE_NAME = { agent:'宿主', user:'用户', task:'任务', session:'会话', document:'文档', project:'项目', repo:'仓库' };
function scopeName(s) {
  if (SCOPE_LABEL[s]) return SCOPE_LABEL[s];
  if (s && s.includes(':')) {
    const [t, ...rest] = s.split(':');
    return `${SCOPE_TYPE_NAME[t] || t} · ${rest.join(':')}`;
  }
  return s;
}

// ================================================================ 连接
async function connect() {
  try {
    await api(`/v1/stats?${scopeQuery()}`);
    state.connected = true;
    localStorage.setItem('leafmem_scope', state.scope);
    await loadScopes();
    chrome(); renderPage();
  } catch (err) {
    state.connected = false; chrome(); renderConnect();
    toast(`连接失败：${err.message}`, true);
  }
}
// 2026-08-10: scope selector is dynamic — only scopes with content are listed.
async function loadScopes() {
  try { state.scopeList = ((await api('/v1/scopes')).scopes || []); }
  catch { state.scopeList = []; }
}

// ================================================================ 框架
function chrome() {
  document.getElementById('conn-dot').className = 'dot' + (state.connected ? ' on' : '');
  document.getElementById('conn-label').textContent = state.connected ? '已连接' : '未连接';
  document.getElementById('conn-scope').textContent = state.connected ? `范围：${scopeName(state.scope)}` : '—';
  document.getElementById('scope-label').style.display = state.connected ? '' : 'none';
  document.getElementById('scope-select').style.display = state.connected ? '' : 'none';
  const sel = document.getElementById('scope-select');
  // 动态范围：全部记忆 + 实际有内容的 scope（来自 /v1/scopes）
  const opts = [['all', SCOPE_LABEL.all],
    ...(state.scopeList || []).map(sc => [sc.scope, `${scopeName(sc.scope)}（${sc.count}）`])];
  sel.innerHTML = opts.map(([v, l]) => `<option value="${esc(v)}"${v === state.scope ? ' selected' : ''}>${esc(l)}</option>`).join('');
  if (![...sel.options].some(o => o.value === state.scope)) {
    sel.insertAdjacentHTML('beforeend', `<option value="${esc(state.scope)}" selected>${esc(scopeName(state.scope))}</option>`);
  }
  const T = { dashboard:['仪表盘','存储健康与活动概览'], explorer:['记忆浏览','检索、筛选与管理记忆'],
    recall:['召回检查','模拟智能体实际检索到的内容'], insights:['洞察','蒸馏原则与用户画像'],
    events:['事件日志','记忆操作审计流水'], graph:['知识图谱','实体关联力导向图'], agents:['宿主接入','WorkBuddy 与昆仑小智的接入配置与修复'], docs:['帮助文档','LeafMem 完整使用手册'], tasks:['任务上下文','task_context 列表'] };
  document.getElementById('page-title').textContent = T[state.page][0];
  document.getElementById('page-sub').textContent = T[state.page][1];
  document.querySelectorAll('.nav button').forEach(b => b.classList.toggle('on', b.dataset.page === state.page));
}
function setScope(v) {
  state.scope = (v && v !== 'project') ? v : 'all';
  localStorage.setItem('leafmem_scope', state.scope);
  state.explorerCache = null;
  chrome(); if (state.connected) renderPage();
}
function goPage(p) {
  // 修复：离开页面即视为一次会话结束，召回检查的查询词不跨页残留——
  // 否则每次切回「召回检查」都会因残留的 recallQuery 自动重跑一次检索。
  if (p !== state.page) state.recallQuery = '';
  state.page = p;
  chrome();
  state.connected ? renderPage() : renderConnect();
}

// dashboard 点击跳转：带预置筛选
function jumpExplorer(kind, source) {
  state.explorerKind = kind || '';
  state.explorerSource = source || '';
  state.explorerPage = 0;
  goPage('explorer');
}
function jumpEvents(type) {
  state.eventType = type || '';
  goPage('events');
}
function jumpInsights() { goPage('insights'); }
function jumpTasks() { goPage('tasks'); }

function renderPage() {
  const el = document.getElementById('page');
  closeDrawer();
  if (!state.connected) return renderConnect();
  ({ dashboard: renderDashboard, explorer: renderExplorer, recall: renderRecall,
     insights: renderInsights, events: renderEvents, graph: renderGraph, agents: renderAgents, docs: renderDocs, tasks: renderTasks })[state.page](el);
}

function renderConnect() {
  document.getElementById('page').innerHTML = `
  <div class="hero">
    <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg></div>
    <h2>LeafMem 记忆控制台</h2>
    <p>面向 AI 智能体的长期记忆控制面。<br>本地服务连接失败，请确认 LeafMem 控制台服务已启动。</p>
    <div class="card">
      <button class="btn primary" style="justify-content:center" onclick="connect()">重试连接</button>
    </div>
  </div>`;
}

// ================================================================ 仪表盘

  el.innerHTML = '<div class="loading">正在加载总览…</div>';
  try {
    const [stats, evData, gov] = await Promise.all([
      api(`/v1/stats?${scopeQuery()}`),
      api('/v1/events?limit=8'),
      api(`/v1/governance?${scopeQuery()}`).catch(() => null),
    ]);
    const kinds = Object.entries(stats.kinds || {}).sort((a, b) => b[1] - a[1]);
    const max = kinds.length ? kinds[0][1] : 1;
    const events = evData.events || [];
    el.innerHTML = `<div class="inner">
      <div class="kpis">
        <div class="kpi c1" style="cursor:pointer" onclick="jumpExplorer()" title="去记忆浏览"><div class="lbl">记忆总数</div><div class="val">${stats.totalMemories}</div><div class="sub">${kinds.length} 种类型</div></div>
        <div class="kpi c2" style="cursor:pointer" onclick="jumpInsights()" title="去洞察"><div class="lbl">蒸馏原则</div><div class="val">${gov?.stats?.principleCount ?? 0}</div><div class="sub">reflect() 沉淀</div></div>
        <div class="kpi c3" style="cursor:pointer" onclick="jumpEvents('recall_built')" title="去事件日志（召回）"><div class="lbl">召回次数</div><div class="val">${gov?.stats?.totalRecallCount ?? 0}</div><div class="sub">${gov?.stats?.entityCount ?? 0} 实体 · ${gov?.stats?.entityLinkCount ?? 0} 关联</div></div>
        <div class="kpi c4" style="cursor:pointer" onclick="jumpTasks()" title="去任务上下文（工作态，非记忆类型）"><div class="lbl">任务上下文</div><div class="val">${stats.taskCount ?? 0}</div><div class="sub">工作态 · 非记忆类型 · ${Object.keys(stats.scopes || {}).length} 个范围</div></div>
      </div>
      <div class="grid2" style="grid-template-columns:1fr 1fr 1fr">
        <div class="card">
          <h3>记忆类型分布 <span class="sub">${esc(scopeName(state.scope))}</span></h3>
          ${kinds.length ? kinds.slice(0, 8).map(([k, n]) => `
            <div class="bar-row" style="cursor:pointer" onclick="jumpExplorer('${esc(k)}')" title="按类型筛选 ${esc(k)}">
              <span class="lbl">${esc(k)}</span>
              <div class="bar"><i style="width:${Math.max(2, (n / max) * 100)}%"></i></div>
              <span class="num">${n}</span>
            </div>`).join('') : '<div class="empty"><div class="msg">该范围暂无记忆</div></div>'}
        </div>
        <div class="card">
          <h3>来源分布 <span class="sub">${fmtDate(stats.oldestMemory)} → ${fmtDate(stats.newestMemory)}</span></h3>
          ${Object.entries(stats.sources || {}).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([k,n]) => `
            <div class="bar-row" style="cursor:pointer" onclick="jumpExplorer(null,'${esc(k)}')" title="按来源筛选 ${esc(k)}">
              <span class="lbl" style="width:150px" title="${esc(k)}">${esc(trunc(k,20))}</span>
              <div class="bar"><i style="width:${Math.max(2,(n/Math.max(...Object.values(stats.sources),1))*100)}%"></i></div>
              <span class="num">${n}</span>
            </div>`).join('')}
        </div>
        <div class="card">
          <h3 style="cursor:pointer" onclick="jumpEvents()" title="去事件日志">最近活动 <span class="sub">最新事件 →</span></h3>
          <div class="tl" style="padding:0">
            ${events.length ? events.map(ev => `
              <div class="tl-item">
                <span class="tl-time">${fmtTime(ev.timestamp)}</span>
                <span class="tl-type"><span class="pill ${evPill(ev.type)}">${esc(ev.type)}</span></span>
                <span class="tl-data">${ev.data ? Object.entries(ev.data).map(([k, v]) => `${k}: ${typeof v === 'string' ? trunc(v, 22) : v}`).join(' · ') : '—'}</span>
              </div>`).join('') : '<div class="empty"><div class="msg">暂无事件</div></div>'}
          </div>
        </div>
      </div>
      ${gov?.profile?.present ? `
      <div class="card" style="cursor:pointer" onclick="jumpInsights()" title="去洞察 · 用户画像">
        <h3>用户画像 <span class="sub">更新于 ${timeAgo(gov.profile.updatedAt)} · ${(gov.profile.sections ?? []).length} 个分节 →</span></h3>
        ${gov.profile.preamble ? `<div class="dw-text" style="color:var(--ink2)">${esc(trunc(gov.profile.preamble, 400))}</div>` : ''}
        <div class="tags-row">${(gov.profile.sections ?? []).map(s => `<span class="pill b">${esc(s.title)}</span>`).join('')}</div>

// ================================================================ 记忆浏览
async function renderExplorer(el) {
  el.innerHTML = '<div class="loading">正在加载记忆…</div>';
  try {
    if (!state.explorerCache || state.explorerCacheScope !== state.scope) {
      const d = await api(`/v1/memories/export?limit=5000&${scopeQuery()}`);
      state.explorerCache = d?.memories || [];
      state.explorerCacheScope = state.scope;
      state.explorerPage = 0;
    }
    let mems = state.explorerCache;
    const kindOpts = [...new Set(mems.map(m => m.kind))].sort();
    // source 筛选：自由文本来源，长尾极重（一次性任务各占一条）。
    // 与仪表盘口径一致：仅展示 ≥20 条的来源（带条数），其余折叠为"其他来源"。
    const sourceCounts = {};
    for (const m of mems) if (m.source) sourceCounts[m.source] = (sourceCounts[m.source] || 0) + 1;
    const sourceRanked = Object.entries(sourceCounts).sort((a, b) => b[1] - a[1]);
    const sourceTop = sourceRanked.filter(([, c]) => c >= 20);
    const sourceTail = sourceRanked.filter(([, c]) => c < 20);
    const sourceTailSet = new Set(sourceTail.map(([k]) => k));
    const sourceTailCount = sourceTail.reduce((sum, [, c]) => sum + c, 0);
    if (state.explorerKind) mems = mems.filter(m => m.kind === state.explorerKind);
    if (state.explorerSource === '__tail__') mems = mems.filter(m => sourceTailSet.has(m.source));
    else if (state.explorerSource) mems = mems.filter(m => m.source === state.explorerSource);
    if (state.explorerQuery) {
      const q = state.explorerQuery.toLowerCase();
      mems = mems.filter(m => (m.content || '').toLowerCase().includes(q) ||
        (m.summary || '').toLowerCase().includes(q) || (m.tags || []).some(t => t.toLowerCase().includes(q)));
    }
    mems = [...mems].sort((a, b) => (b.updatedAt || '').localeCompare(a.updatedAt || ''));
    const pages = Math.max(1, Math.ceil(mems.length / PAGE_SIZE));
    state.explorerPage = Math.min(state.explorerPage, pages - 1);
    const rows = mems.slice(state.explorerPage * PAGE_SIZE, (state.explorerPage + 1) * PAGE_SIZE);

    el.innerHTML = `<div class="inner">
      <div class="toolbar">
        <div class="search-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input class="input" id="explorer-search" placeholder="搜索内容、摘要、标签…" value="${esc(state.explorerQuery)}" oninput="explorerSearch(this.value)">
        </div>
        <select class="input" onchange="state.explorerKind=this.value;state.explorerPage=0;renderPage()">
          <option value="">全部类型</option>
          ${kindOpts.map(k => `<option value="${esc(k)}"${k === state.explorerKind ? ' selected' : ''}>${esc(k)}</option>`).join('')}
        </select>
        <select class="input" onchange="state.explorerSource=this.value;state.explorerPage=0;renderPage()">
          <option value="">全部来源</option>
          ${sourceTop.map(([k, c]) => `<option value="${esc(k)}"${k === state.explorerSource ? ' selected' : ''}>${esc(k)}（${c}）</option>`).join('')}
          ${sourceTail.length ? `<option value="__tail__"${state.explorerSource === '__tail__' ? ' selected' : ''}>其他来源（${sourceTail.length} 种 · ${sourceTailCount} 条）</option>` : ''}
          ${(state.explorerSource && state.explorerSource !== '__tail__' && !sourceTop.some(([k]) => k === state.explorerSource) && !sourceTailSet.has(state.explorerSource)) ? `<option value="${esc(state.explorerSource)}" selected>${esc(state.explorerSource)}</option>` : ''}
        </select>
        <span class="mono-sm">${mems.length} 条记录</span>
        <div class="spacer"></div>
        <button class="btn sm" onclick="exportMemories()">导出 JSON ↓</button>
        <div class="pager">
          <span class="info">第 ${state.explorerPage + 1}/${pages} 页</span>
          <button class="btn sm" ${state.explorerPage === 0 ? 'disabled' : ''} onclick="state.explorerPage=0;renderPage()">«</button>
          <button class="btn sm" ${state.explorerPage === 0 ? 'disabled' : ''} onclick="state.explorerPage--;renderPage()">‹</button>
          <button class="btn sm" ${state.explorerPage >= pages - 1 ? 'disabled' : ''} onclick="state.explorerPage++;renderPage()">›</button>
          <button class="btn sm" ${state.explorerPage >= pages - 1 ? 'disabled' : ''} onclick="state.explorerPage=${pages - 1};renderPage()">»</button>
        </div>
      </div>
      <div class="card plain">
        <table>
          <thead><tr><th style="width:100px">类型</th><th>内容</th><th style="width:170px">范围</th><th style="width:90px">更新</th><th style="width:70px"></th></tr></thead>
          <tbody>
            ${rows.length ? rows.map(m => `
              <tr onclick="openDrawer('${esc(m.id)}')">
                <td><span class="pill ${KIND_PILL[m.kind] || 'gray'}">${esc(m.kind)}</span></td>
                <td>
                  <div class="cell-preview">${esc(m.content)}</div>
                  ${m.tags?.length ? `<div class="tags-row">${m.tags.map(t => `<span class="pill">${esc(t)}</span>`).join('')}</div>` : ''}
                </td>
                <td><span class="pill p">${esc(m.scope?.type)}:${esc(trunc(m.scope?.id, 14))}</span></td>
                <td class="mono-sm">${timeAgo(m.updatedAt)}</td>
                <td><button class="btn sm danger" onclick="event.stopPropagation();deleteMemory('${esc(m.id)}','${esc(m.scope?.type)}:${esc(m.scope?.id)}')">删除</button></td>
              </tr>`).join('') : `<tr><td colspan="5"><div class="empty"><div class="glyph">⌀</div><div class="msg">没有匹配的记录</div></div></td></tr>`}
          </tbody>
        </table>
      </div>
    </div>`;
  } catch (err) { el.innerHTML = `<div class="empty"><div class="glyph">⚠</div><div class="msg">${esc(err.message)}</div></div>`; }
}
let searchTimer = null;
function explorerSearch(v) { clearTimeout(searchTimer); searchTimer = setTimeout(() => { state.explorerQuery = v; state.explorerPage = 0; renderPage(); }, 250); }

async function exportMemories() {
  try {
    const d = await api(`/v1/memories/export?limit=5000&${scopeQuery()}`);
    const blob = new Blob([JSON.stringify(d.memories || [], null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `leafmem-export-${state.scope.replace(/[:/]/g, '_')}.json`;
    a.click(); URL.revokeObjectURL(a.href);
    toast('已导出 JSON 文件');
  } catch (err) { toast(`导出失败：${err.message}`, true); }
}
async function deleteMemory(id, scopeStr) {
  if (!confirm('确定永久删除这条记忆？')) return;
  try {
    // 破坏性操作需显式 scope（服务端隔离语义）：携带记录自身所属范围
    const delQuery = scopeStr ? `scope=${encodeURIComponent(scopeStr)}` : scopeQuery();
    await fetch(`${API_BASE}/v1/memories/${id}?${delQuery}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${state.apiKey}` } });
    state.explorerCache = null;
    toast('已删除'); renderPage();
  } catch (err) { toast(`删除失败：${err.message}`, true); }
}

// ================================================================ 抽屉
async function openDrawer(id) {
  const dw = document.getElementById('drawer'), body = document.getElementById('drawer-body');
  const t = document.getElementById('drawer-title'); if (t) t.textContent = '记忆详情';
  dw.classList.add('open');
  let m = (state.explorerCache || []).find(x => x.id === id);
  if (!m) {
    body.innerHTML = '<div class="loading">加载中…</div>';
    try { m = ((await api(`/v1/memories/export?limit=5000&${scopeQuery()}`)).memories || []).find(x => x.id === id); } catch {}
  }
  if (!m) { body.innerHTML = '<div class="empty"><div class="msg">未找到该记录</div></div>'; return; }
  body.innerHTML = `
    <div class="dw-sec"><div style="display:flex;gap:6px;flex-wrap:wrap">
      <span class="pill ${KIND_PILL[m.kind] || 'gray'}">${esc(m.kind)}</span>
      <span class="pill p">${esc(m.scope?.type)}:${esc(m.scope?.id)}</span>
      ${(m.tags || []).includes('pinned') ? '<span class="pill gray">📌 已固定</span>' : ''}
      ${m.kind === 'principle' ? '<span class="pill g">✦ 蒸馏产出</span>' : ''}
    </div></div>
    <div class="dw-sec"><div class="dw-lbl">内容</div><div class="dw-text">${esc(m.content)}</div></div>
    ${m.summary ? `<div class="dw-sec"><div class="dw-lbl">摘要</div><div class="dw-text">${esc(m.summary)}</div></div>` : ''}
    ${m.tags?.length ? `<div class="dw-sec"><div class="dw-lbl">标签</div><div class="tags-row">${m.tags.map(t => `<span class="pill">${esc(t)}</span>`).join('')}</div></div>` : ''}
    <div class="dw-sec"><div class="dw-lbl">元信息</div>
      <div class="dw-kv">
        <span class="k">ID</span><span class="v">${esc(m.id)}</span>
        <span class="k">来源</span><span class="v">${esc(m.source || '—')}</span>
        <span class="k">重要性</span><span class="v">${m.importance != null ? Number(m.importance).toFixed(2) : '—'}</span>
        <span class="k">创建</span><span class="v">${esc(m.createdAt || '—')}</span>
        <span class="k">更新</span><span class="v">${esc(m.updatedAt || '—')}</span>
        ${m.metadata?.originFile ? `<span class="k">原始文件</span><span class="v">${esc(m.metadata.originFile)}</span>` : ''}
      </div>
    </div>
    <button class="btn sm danger" onclick="deleteMemory('${esc(m.id)}','${esc(m.scope?.type)}:${esc(m.scope?.id)}')">删除该记录</button>`;
}
function closeDrawer() { document.getElementById('drawer').classList.remove('open'); }

// ================================================================ 召回检查
async function renderRecall(el) {
  el.innerHTML = `<div class="inner">
    <div class="card" style="display:flex;gap:10px">
      <input class="input" style="flex:1" id="recall-query" placeholder="智能体会怎么问？例如「服务怎么部署」" value="${esc(state.recallQuery)}" onkeydown="if(event.key==='Enter')runRecall()">
      <button class="btn primary" onclick="runRecall()">开始检查</button>
    </div>
    <div id="recall-results"></div>
  </div>`;
  if (state.recallQuery) runRecall();
}
async function runRecall() {
  const q = document.getElementById('recall-query')?.value.trim();
  if (!q) return;
  state.recallQuery = q;
  const out = document.getElementById('recall-results');
  out.innerHTML = '<div class="loading">正在检索…</div>';
  try {
    const d = await api('/v1/recall', { method: 'POST',
      body: JSON.stringify({ context: scopeContext(), message: q, inspect: true, maxChars: 8000 }) });
    const hits = d.hits || [];
    out.innerHTML = hits.length ? hits.map(h => {
      const r = h.record || {};
      const reasons = Object.entries(h.reasons || {}).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]);
      return `
      <div class="hit">
        <div class="hit-head">
          <span class="hit-score">${(h.score ?? 0).toFixed(3)}</span>
          <div class="hit-bar"><i style="width:${Math.min(100, (h.score ?? 0) * 100)}%"></i></div>
          <span class="pill ${KIND_PILL[r.kind] || 'gray'}">${esc(r.kind)}</span>
          <span class="pill p">${esc(r.scope?.type)}:${esc(trunc(r.scope?.id, 12))}</span>
        </div>
        <div class="hit-summary">${esc(r.summary || trunc(r.content, 160))}</div>
        <div class="hit-reasons">${reasons.map(([k, v]) => `<span class="reason${v >= 0.7 ? ' hot' : ''}">${k} ${Number(v).toFixed(2)}</span>`).join('')}</div>
      </div>`;
    }).join('') : '<div class="empty"><div class="glyph">⌀</div><div class="msg">该问题未检索到任何记忆</div></div>';
  } catch (err) { out.innerHTML = `<div class="empty"><div class="glyph">⚠</div><div class="msg">${esc(err.message)}</div></div>`; }
}

// ================================================================ 知识图谱
const KIND_COLOR = { person:'#dc2626', project:'#2563eb', tech:'#7c3aed', tool:'#d97706', org:'#0d9488' };
const graphFilter = { kind: null };
function toggleGraphFilter(kind) {
  graphFilter.kind = graphFilter.kind === kind ? null : kind;
  document.querySelectorAll('.graph-legend-pill').forEach(p => {
    const on = p.dataset.kind === graphFilter.kind;
    p.style.outline = on ? '2px solid ' + (KIND_COLOR[graphFilter.kind] || '#64748b') : 'none';
    p.style.opacity = (!graphFilter.kind || on) ? 1 : .35;
  });
  if (window.__graphRedraw) window.__graphRedraw();
}
async function renderGraph(el) {
  el.innerHTML = '<div class="loading">正在加载图谱…</div>';
  try {
    const d = await api('/v1/graph?limit=400');
    const nodes = (d.nodes || []).map((n, i) => ({ ...n, x: 0, y: 0, vx: 0, vy: 0, _i: i }));
    const idx = new Map(nodes.map((n, i) => [n.id, i]));
    const edges = (d.edges || []).filter(e => idx.has(e.source_entity_id) && idx.has(e.target_entity_id))
      .map(e => ({ s: idx.get(e.source_entity_id), t: idx.get(e.target_entity_id), rel: e.relation }));
    if (!nodes.length) { el.innerHTML = '<div class="empty"><div class="glyph">⬡</div><div class="msg">暂无实体数据，写入记忆时会自动抽取实体</div></div>'; return; }
    const kinds = [...new Set(nodes.map(n => n.kind))];
    graphFilter.kind = null;
    el.innerHTML = `<div class="inner">
      <div class="card plain" style="position:relative">
        <div style="position:absolute;top:14px;left:20px;z-index:2;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <span class="mono-sm">${nodes.length} 实体 · ${edges.length} 实体间关联 · ${d.totalMemoryLinks ?? 0} 记忆链接</span>
          ${kinds.map(k => `<span class="pill graph-legend-pill" data-kind="${esc(k)}" onclick="toggleGraphFilter('${esc(k)}')" title="点击过滤 ${esc(k)}" style="cursor:pointer;background:${(KIND_COLOR[k]||'#64748b')}18;color:${KIND_COLOR[k]||'#64748b'}">● ${esc(k)}</span>`).join('')}
          <span class="mono-sm" style="color:var(--ink2)">点击图例过滤 · 点击节点看详情 · 拖拽移动</span>
        </div>
        <canvas id="graph-canvas" style="width:100%;height:640px;display:block;cursor:grab"></canvas>
      </div>
      <div id="graph-detail"></div>
    </div>`;
    startForceLayout(document.getElementById('graph-canvas'), nodes, edges);
  } catch (err) { el.innerHTML = `<div class="empty"><div class="glyph">⚠</div><div class="msg">${esc(err.message)}</div></div>`; }
}

function startForceLayout(canvas, nodes, edges) {
  const dpr = window.devicePixelRatio || 1;
  const resize = () => { const r = canvas.getBoundingClientRect(); canvas.width = r.width * dpr; canvas.height = r.height * dpr; };
  resize();
  const ctx = canvas.getContext('2d');
  const W = () => canvas.width / dpr, H = () => canvas.height / dpr;
  const maxLink = Math.max(...nodes.map(n => n.link_count || 1), 1);
  const radius = n => 5 + 9 * Math.sqrt((n.link_count || 1) / maxLink);
  const degree = new Array(nodes.length).fill(0);
  edges.forEach(e => { degree[e.s]++; degree[e.t]++; });
  const connected = [], isolated = [];
  nodes.forEach((n, i) => (degree[i] ? connected.push(n) : isolated.push(n)));
  // 外环：无实体关联的节点，按记忆链接数排布在大环上（内侧留给有实体关联的）
  isolated.sort((a, b) => (b.link_count || 0) - (a.link_count || 0));
  isolated.forEach((n, i) => {
    const ang = (i / Math.max(isolated.length, 1)) * Math.PI * 2 - Math.PI / 2;
    n.x = W() / 2 + Math.cos(ang) * (W() / 2 - 52);
    n.y = H() / 2 + Math.sin(ang) * (H() / 2 - 52);
    n._iso = true;
  });
  connected.forEach((n, i) => {
    const ang = (i / Math.max(connected.length, 1)) * Math.PI * 2;
    const ring = 70 + (i % 3) * 40;
    n.x = W() / 2 + Math.cos(ang) * ring;
    n.y = H() / 2 + Math.sin(ang) * ring;
  });

  let hovered = null, selected = null, dragNode = null, mouseX = 0, mouseY = 0;
  let dragMoved = false, dragNodeWasHover = null;
  const visible = n => !graphFilter.kind || n.kind === graphFilter.kind;

  // 单步物理（alpha 给定），供预模拟与动画共用
  function step(alpha) {
    for (let i = 0; i < connected.length; i++) {
      for (let j = i + 1; j < connected.length; j++) {
        const a = connected[i], b = connected[j];
        const dx = a.x - b.x, dy = a.y - b.y;
        const d2 = dx * dx + dy * dy || 1;
        if (d2 < 90000) {
          const f = 2400 * alpha / d2;
          a.vx += dx * f; a.vy += dy * f; b.vx -= dx * f; b.vy -= dy * f;
        }
      }
    }
    for (const e of edges) {
      const a = nodes[e.s], b = nodes[e.t];
      if (a._iso || b._iso) continue;
      const dx = b.x - a.x, dy = b.y - a.y;
      const d = Math.hypot(dx, dy) || 1;
      const f = (d - 95) * 0.014 * alpha;
      a.vx += (dx / d) * f; a.vy += (dy / d) * f;
      b.vx -= (dx / d) * f; b.vy -= (dy / d) * f;
    }
    for (const n of connected) {
      if (n === dragNode) continue;
      n.vx += (W() / 2 - n.x) * 0.02 * alpha;
      n.vy += (H() / 2 - n.y) * 0.02 * alpha;
      n.vx *= 0.55; n.vy *= 0.55;
      n.x += n.vx; n.y += n.vy;
      const pad = 60;
      n.x = Math.max(pad, Math.min(W() - pad, n.x));
      n.y = Math.max(pad, Math.min(H() - pad, n.y));
    }
  }

  // 预模拟：进场前同步收敛 260 步，消除"抽搐"抖动
  for (let i = 0; i < 260; i++) step(Math.max(0.05, 1 - i / 220));

  function neighborSet(node) {
    const s = new Set([node]);
    for (const e of edges) {
      if (nodes[e.s] === node) s.add(nodes[e.t]);
      if (nodes[e.t] === node) s.add(nodes[e.s]);
    }
    return s;
  }
  let neighbors = null;

  function draw() {
    ctx.save();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W(), H());
    // 边：hover 邻接高亮加粗，其余按过滤/悬停态淡化
    for (const e of edges) {
      const a = nodes[e.s], b = nodes[e.t];
      if (!visible(a) || !visible(b)) { ctx.globalAlpha = 0.05; ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 1; }
      else if (hovered && (a === hovered || b === hovered)) { ctx.globalAlpha = 0.95; ctx.strokeStyle = '#16a34a'; ctx.lineWidth = 2; }
      else if (hovered) { ctx.globalAlpha = 0.08; ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 1; }
      else { ctx.globalAlpha = 0.3; ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 1; }
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    // 节点
    for (const n of nodes) {
      const isHl = hovered && neighbors?.has(n);
      ctx.beginPath();
      ctx.arc(n.x, n.y, radius(n), 0, Math.PI * 2);
      ctx.fillStyle = KIND_COLOR[n.kind] || '#64748b';
      ctx.globalAlpha = !visible(n) ? 0.07 : hovered ? (isHl ? 1 : 0.15) : 0.92;
      ctx.fill();
      ctx.globalAlpha = 1;
      if (n === hovered || n === selected) { ctx.strokeStyle = '#1a2332'; ctx.lineWidth = 2.5; ctx.stroke(); }
      else if (isHl) { ctx.strokeStyle = '#16a34a'; ctx.lineWidth = 1.5; ctx.stroke(); }
    }
    // 标签：全显；hover 邻接/选中加深，其余按态淡化
    ctx.font = '10px -apple-system, "PingFang SC", sans-serif';
    ctx.textAlign = 'center';
    for (const n of nodes) {
      if (!visible(n)) continue;
      const isHl = hovered && neighbors?.has(n);
      ctx.fillStyle = (n === hovered || n === selected || isHl) ? '#1a2332' : hovered ? 'rgba(26,35,50,.2)' : 'rgba(26,35,50,.62)';
      ctx.fillText(n.name, n.x, n.y + radius(n) + 12);
    }
    // hover 浮窗
    if (hovered) {
      const rel = edges.filter(e => nodes[e.s] === hovered || nodes[e.t] === hovered);
      const lines = rel.slice(0, 5).map(e => {
        const other = nodes[e.s] === hovered ? nodes[e.t] : nodes[e.s];
        return '— ' + e.rel + ' → ' + other.name;
      });
      ctx.textAlign = 'left';
      ctx.fillStyle = 'rgba(255,255,255,.97)';
      const bw = 240, bh = 26 + lines.length * 16;
      const bx = Math.min(mouseX + 14, W() - bw - 8), by = Math.min(mouseY + 10, H() - bh - 8);
      ctx.fillRect(bx, by, bw, bh);
      ctx.strokeStyle = '#e5e9f0'; ctx.strokeRect(bx, by, bw, bh);
      ctx.fillStyle = '#1a2332';
      ctx.font = 'bold 12px -apple-system, "PingFang SC", sans-serif';
      ctx.fillText(hovered.name + '（' + hovered.kind + ' · ' + hovered.link_count + ' 条记忆链接）', bx + 10, by + 17);
      ctx.font = '11px -apple-system, "PingFang SC", sans-serif';
      ctx.fillStyle = '#5b6675';
      lines.forEach((l, i) => ctx.fillText(l, bx + 10, by + 34 + i * 16));
    }
    ctx.restore();
  }
  window.__graphRedraw = draw;

  canvas.addEventListener('mousemove', (ev) => {
    const r = canvas.getBoundingClientRect();
    mouseX = ev.clientX - r.left; mouseY = ev.clientY - r.top;
    if (dragNode) { dragMoved = true; dragNode.x = mouseX; dragNode.y = mouseY; dragNode.vx = 0; dragNode.vy = 0; return; }
    hovered = null;
    for (const n of nodes) {
      if (visible(n) && Math.hypot(n.x - mouseX, n.y - mouseY) < radius(n) + 4) { hovered = n; break; }
    }
    neighbors = hovered ? neighborSet(hovered) : null;
    canvas.style.cursor = hovered ? 'pointer' : 'grab';
    draw();
  });
  canvas.addEventListener('mousedown', () => { dragMoved = false; dragNodeWasHover = hovered; dragNode = hovered; });
  window.addEventListener('mouseup', () => {
    const wasClick = dragNode && !dragMoved;
    dragNode = null;
    if (wasClick && dragNodeWasHover) { selected = dragNodeWasHover; showEntityDetail(selected); }
    else if (wasClick && !dragNodeWasHover) { selected = null; showEntityDetail(null); }
    draw();
  });

  // 动画：从低 alpha 起步微调，视觉平稳
  let alpha = 0.06;
  function tick() {
    alpha = Math.max(0.015, alpha * 0.995);
    step(alpha);
    draw();
    requestAnimationFrame(tick);
  }
  draw();
  requestAnimationFrame(tick);
}

async function showEntityDetail(node) {
  const box = document.getElementById('graph-detail');
  if (!node) { box.innerHTML = ''; return; }
  box.innerHTML = '<div class="loading">正在加载实体详情…</div>';
  try {
    const d = await api('/v1/graph/entity?id=' + encodeURIComponent(node.id));
    const rels = d.relations || [], mems = d.memories || [];
    box.innerHTML = `<div class="card" style="margin-top:14px">
      <h3>${esc(node.name)} <span class="pill" style="background:${(KIND_COLOR[node.kind]||'#64748b')}18;color:${KIND_COLOR[node.kind]||'#64748b'}">${esc(node.kind)}</span>
        <span class="sub">${node.link_count} 条记忆链接 · ${rels.length} 实体间关联</span></h3>
      ${rels.length ? '<div class="dw-lbl">实体关联</div>' + rels.map(r => `
        <div class="bar-row" style="margin-bottom:6px">
          <span class="lbl" style="width:110px">${esc(r.dir === 'out' ? r.relation : '← ' + r.relation)}</span>
          <span style="font-size:12.5px">${esc(r.other_name)} <span class="mono-sm">(${esc(r.other_kind)})</span></span>
        </div>`).join('') : ''}
      ${mems.length ? '<div class="dw-lbl" style="margin-top:12px">关联记忆（' + mems.length + '）</div>' + mems.slice(0, 10).map(m => `
        <div style="padding:8px 0;border-bottom:1px solid var(--line)">
          <div style="font-size:12.5px;line-height:1.6">${esc(String(m.content || '').slice(0, 160))}</div>
          <div class="mono-sm" style="margin-top:3px">${esc(m.memory_kind)} · ${esc(m.relation)}</div>
        </div>`).join('') : '<div class="empty"><div class="msg">暂无关联记忆</div></div>'}
    </div>`;
  } catch (err) { box.innerHTML = `<div class="empty"><div class="msg">${esc(err.message)}</div></div>`; }
}


// ================================================================ 任务上下文
// 任务上下文 = Agent 的工作态（transcript + rolling summary），与记忆记录是
// 两套数据：记忆是"值得长期保留的知识"，任务上下文是"正在/曾经推进的事"。
// 它不是记忆的一种类型，故单独成页；行点击展开该任务的工作态详情。
async function renderTasks(el) {
  const limit = 50, offset = (state.tasksPage || 0) * limit;
  el.innerHTML = '<div class="loading">正在加载任务上下文…</div>';
  try {
    const d = await api('/v1/tasks?limit=' + limit + '&offset=' + offset);
    const tasks = d.tasks || [], total = d.total ?? tasks.length;
    const pages = Math.max(1, Math.ceil(total / limit));
    const page = state.tasksPage || 0;
    el.innerHTML = `<div class="inner">
      <div class="toolbar">
        <span class="mono-sm">共 ${total} 个任务上下文 · 与记忆是两套数据（工作态 vs 知识），不是记忆类型</span>
        <div class="spacer"></div>
        <div class="pager">
          <span class="info">第 ${page + 1}/${pages} 页</span>
          <button class="btn sm" ${page === 0 ? 'disabled' : ''} onclick="state.tasksPage=0;renderPage()">«</button>
          <button class="btn sm" ${page === 0 ? 'disabled' : ''} onclick="state.tasksPage--;renderPage()">‹</button>
          <button class="btn sm" ${page >= pages - 1 ? 'disabled' : ''} onclick="state.tasksPage++;renderPage()">›</button>
          <button class="btn sm" ${page >= pages - 1 ? 'disabled' : ''} onclick="state.tasksPage=${pages - 1};renderPage()">»</button>
        </div>
      </div>
      <div class="card plain">
        <table>
          <thead><tr><th>任务 ID</th><th>标题</th><th style="width:140px">范围</th><th style="width:90px">状态</th><th style="width:100px">更新</th><th style="width:70px"></th></tr></thead>
          <tbody>
            ${tasks.length ? tasks.map(t => `
              <tr onclick="openTaskDrawer('${esc(t.task_id)}')" style="cursor:pointer" title="右侧浮窗查看工作态详情">
                <td class="mono-sm">${esc(trunc(t.task_id, 38))}</td>
                <td>${esc(t.title)}</td>
                <td><span class="pill p">${esc(t.scope_type)}:${esc(trunc(t.scope_id, 12))}</span></td>
                <td><span class="pill ${t.status === 'completed' ? 'g' : 'b'}">${esc(t.status)}</span></td>
                <td class="mono-sm">${timeAgo(new Date(t.updated_at).toISOString())}</td>
                <td class="mono-sm">详情 ⮕</td>
              </tr>`).join('') : '<tr><td colspan="6"><div class="empty"><div class="glyph">⌀</div><div class="msg">暂无任务上下文</div></div></td></tr>'}
          </tbody>
        </table>
      </div>
      <div id="task-detail"></div>
    </div>`;
  } catch (err) { el.innerHTML = `<div class="empty"><div class="glyph">⚠</div><div class="msg">${esc(err.message)}</div></div>`; }
}

function openTaskDrawer(id) {
  const dw = document.getElementById('drawer'), body = document.getElementById('drawer-body');
  const title = document.getElementById('drawer-title');
  if (title) title.textContent = '任务工作态详情';
  dw.classList.add('open');
  body.innerHTML = '<div class="loading">正在加载任务详情…</div>';
  api('/v1/tasks/detail?id=' + encodeURIComponent(id)).then(d => {
    const t = d.task;
    if (!t) { body.innerHTML = '<div class="empty"><div class="msg">任务不存在</div></div>'; return; }
    body.innerHTML = `
      <div class="dw-sec"><div style="display:flex;gap:6px;flex-wrap:wrap">
        <span class="pill p">${esc(t.scope_type)}:${esc(t.scope_id)}</span>

      <div class="dw-sec"><div class="dw-lbl">Transcript 条目（${(d.entries || []).length}）</div>

        : `<button class="btn sm primary" onclick="agentAction('/v1/agents/install', '${esc(a.agent)}')" title="写入 MCP 配置并注入记忆使用规则">配置</button>`}

async function agentAction(path, agent) {
  await runMutation(() => api(path, { method: 'POST', body: JSON.stringify({ agent, sharedMemory: !!(state.topology && state.topology.shared) }) }), agent);
}
async function toggleTopology(shared) {
  const t = state.topology || { shared: false };
  const primary = (state.topology && state.topology.primaryScopeId) || 'workbuddy';
  const msg = shared
    ? '确认共用一套记忆？\n各宿主将统一落到主 scope agent:' + primary + ' 单一记忆池：\n长期记忆 + 实体图谱 + 用户画像 + 工作状态 四层全部共享。\n（修改各宿主的 mcp.json，改完需在各宿主重连 MCP 生效）'
    : '确认分拆为独立记忆？\n各宿主将落回各自的 agent:<宿主> scope，互不可见。\n⚠️ 已写入主 scope agent:' + primary + ' 的历史记忆仍留在那里，分拆后其他宿主只能看到自己新写的。\n（改完需在各宿主重连 MCP 生效）';
  if (!confirm(msg)) return;
  await runMutation(() => api('/v1/agents/topology', { method: 'POST', body: JSON.stringify({ shared }) }));
  toast(shared ? '已切换为共用一套记忆' : '已分拆为独立记忆');
}
async function runMutation(fn, agent) {
  const btns = [...document.querySelectorAll('.agent-actions button, .infra button')];
  btns.forEach(b => b.disabled = true);
  try {
    await fn();
    toast(agent ? `${agent}：操作完成` : '批量操作完成');
    await loadAgentIds();
    renderPage();
  } catch (err) {
    toast(`操作失败：${err.message}`, true);
    btns.forEach(b => b.disabled = false);
  }
}


// ================================================================ 帮助文档（零依赖 Markdown 渲染 + TOC + 搜索）
async function renderDocs(el) {
  el.innerHTML = '<div class="loading">正在加载帮助文档…</div>';
  try {
    const d = await api('/v1/docs');
    const md = d.markdown || '# LeafMem\n\n文档暂不可用。';
    const rendered = mdToHtml(md);
    el.innerHTML = `<div style="display:flex;gap:16px;align-items:flex-start;max-width:1280px;margin:0 auto">
      <aside style="width:220px;flex-shrink:0;position:sticky;top:10px;max-height:calc(100vh - 120px);overflow-y:auto">
        <div class="card plain" style="padding:12px">
          <input class="input" id="docs-search" placeholder="🔍 全文搜索文档…" oninput="docsSearch(this.value)" style="width:100%;margin-bottom:6px">
          <div class="mono-sm" id="docs-search-count" style="min-height:14px;margin-bottom:6px"></div>
          <nav id="docs-toc">${rendered.toc}</nav>
        </div>
      </aside>
      <div class="card" style="flex:1;min-width:0;max-width:860px">
        <div class="doc-body" id="docs-body">${rendered.html}</div>
      </div>
    </div>`;
    initMermaid();
  } catch (err) {
    el.innerHTML = `<div class="empty"><div class="glyph">⚠</div><div class="msg">${esc(err.message)}</div></div>`;
  }
}

function mdInline(text) {
  // text is already HTML-escaped; add inline markdown
  return text
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/`([^`]+)`/g, '<code style="background:#f1f3f5;padding:1px 5px;border-radius:4px;font-family:var(--mono);font-size:0.9em">$1</code>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, (m, t, href) => {
      if (/^https?:/i.test(href)) return `<a href="${href}" target="_blank" rel="noopener">${t}</a>`;
      return `<span title="${esc(href)}">${t}</span>`; // 仓库内相对链接在 console 内不跳转
    });
}

function mdToHtml(md) {
  const lines = md.replace(/\r\n/g, '\n').split('\n');
  let html = '', toc = '', slugCount = {};
  let inCode = false, codeLang = '', codeBuf = [];
  let inTable = false, tableRows = [];
  let inList = false;

  const slugOf = (text) => {
    const base = text.toLowerCase().replace(/[^\w\u4e00-\u9fa5]+/g, '-').replace(/^-+|-+$/g, '') || 'section';
    slugCount[base] = (slugCount[base] ?? 0) + 1;
    return slugCount[base] > 1 ? `${base}-${slugCount[base]}` : base;
  };
  const flushTable = () => {
    if (!inTable) return;
    const [head, ...body] = tableRows;
    html += '<table class="doc-table"><thead><tr>' + head.map(c => `<th>${mdInline(c)}</th>`).join('') + '</tr></thead><tbody>' +
      body.map(r => '<tr>' + r.map(c => `<td>${mdInline(c)}</td>`).join('') + '</tr>').join('') + '</tbody></table>';
    tableRows = []; inTable = false;
  };
  const flushList = () => { if (inList) { html += '</ul>'; inList = false; } };

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    if (line.startsWith('```')) {
      if (!inCode) { inCode = true; codeLang = line.slice(3).trim(); codeBuf = []; }
      else {
        inCode = false;
        const isMermaid = codeLang === 'mermaid';
        // mermaid 块：源码保留在 pre.mermaid-src，DOM 插入后由 initMermaid() 渲染成图形；
        // 加载失败时降级显示源码。README 是唯一事实源，改图只改 README。
        html += isMermaid
          ? `<div class="doc-mermaid"><div class="doc-code-lang">mermaid</div><pre class="mermaid-src">${esc(codeBuf.join('\n'))}</pre><div class="mermaid-out"></div></div>`
          : `<div class="doc-code"><div class="doc-code-lang">${esc(codeLang || 'code')}</div><pre>${esc(codeBuf.join('\n'))}</pre></div>`;
      }
      continue;
    }
    if (inCode) { codeBuf.push(line); continue; }

    // 表格
    if (line.trim().startsWith('|') && line.trim().endsWith('|')) {
      const cells = line.trim().slice(1, -1).split('|').map(c => c.trim());
      if (cells.every(c => /^:?-+:?$/.test(c))) continue; // 分隔行
      if (!inTable) { inTable = true; tableRows = []; }
      tableRows.push(cells);
      continue;
    } else flushTable();

    // 标题
    const h = line.match(/^(#{1,4})\s+(.*)$/);
    if (h) {
      flushList();
      const level = h[1].length;
      const text = h[2].replace(/\*\*/g, '').trim();
      const slug = slugOf(text);
      html += `<h${level} id="${slug}">${mdInline(esc(text))}</h${level}>`;
      if (level <= 2) toc += `<a class="doc-toc-l${level}" href="#${slug}" onclick="return docsJump('${slug}')">${esc(text)}</a>`;
      continue;
    }
    // 引用
    if (line.startsWith('> ')) { flushList(); html += `<blockquote>${mdInline(esc(line.slice(2)))}</blockquote>`; continue; }
    // 分隔线 / 对齐占位
    if (/^-{3,}$/.test(line.trim()) || /^<p align/.test(line.trim()) || /^<\/p/.test(line.trim()) || /^<img /.test(line.trim()) || /^<sub>/.test(line.trim())) { flushList(); continue; }
    // 列表
    const li = line.match(/^[-*]\s+(.*)$/);
    if (li) { if (!inList) { html += '<ul>'; inList = true; } html += `<li>${mdInline(esc(li[1]))}</li>`; continue; }
    flushList();
    // 空行
    if (!line.trim()) continue;
    // 段落
    html += `<p>${mdInline(esc(line))}</p>`;
  }
  flushTable(); flushList();
  return { html, toc };
}

function docsJump(slug) {
  const el = document.getElementById(slug);
  if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); el.classList.add('doc-flash'); setTimeout(() => el.classList.remove('doc-flash'), 1200); }
  return false;
}

// 全文搜索：在正文文本节点中高亮匹配并滚动到首个命中，显示计数；
// 目录同时按标题过滤（辅助导航）。
let docsSearchTimer = null;
function docsSearch(q) {
  clearTimeout(docsSearchTimer);
  docsSearchTimer = setTimeout(() => docsSearchNow(q), 200);
}
function docsSearchNow(q) {
  const body = document.getElementById('docs-body');
  if (!body) return;
  // 清除旧高亮
  body.querySelectorAll('mark.doc-hit').forEach(m => {
    const parent = m.parentNode;
    parent.replaceChild(document.createTextNode(m.textContent), m);
    parent.normalize();
  });
  const counter = document.getElementById('docs-search-count');
  const query = q.trim().toLowerCase();
  if (!query) { if (counter) counter.textContent = ''; return; }
  let count = 0, first = null;
  const walker = document.createTreeWalker(body, NodeFilter.SHOW_TEXT, {
    acceptNode: (node) => {
      if (!node.nodeValue || !node.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
      if (node.parentElement && node.parentElement.closest('script,style')) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    },
  });
  const targets = [];
  while (walker.nextNode()) targets.push(walker.currentNode);
  for (const node of targets) {
    const text = node.nodeValue;
    const lower = text.toLowerCase();
    let idx = lower.indexOf(query);
    if (idx === -1) continue;
    const frag = document.createDocumentFragment();
    let last = 0;
    while (idx !== -1) {
      frag.appendChild(document.createTextNode(text.slice(last, idx)));
      const mark = document.createElement('mark');
      mark.className = 'doc-hit' + (count === 0 ? ' doc-hit-first' : '');
      mark.textContent = text.slice(idx, idx + query.length);
      frag.appendChild(mark);
      count++;
      if (!first) first = mark;
      last = idx + query.length;
      idx = lower.indexOf(query, last);
    }
    frag.appendChild(document.createTextNode(text.slice(last)));
    node.parentNode.replaceChild(frag, node);
  }
  if (counter) counter.textContent = count ? `${count} 处命中` : '无匹配';
  if (first) {
    // 立即跳转（不用 smooth）：smooth 会被后续布局变化打断，直接赋值最可靠；
    // 首个命中额外加脉冲高亮，视觉上明确"滚到了哪里"。
    const page = document.getElementById('page');
    const r = first.getBoundingClientRect();
    const pr = page.getBoundingClientRect();
    page.scrollTop = page.scrollTop + (r.top - pr.top) - pr.height * 0.35;
    first.classList.add('doc-flash');
  }
  // 目录按标题辅助过滤
  document.querySelectorAll('#docs-toc a').forEach(a => {
    a.style.display = a.textContent.toLowerCase().includes(query) ? '' : 'none';
  });
}

// mermaid 渲染：懒加载 /console/mermaid.min.js（vendor 自包含），失败降级源码
let mermaidPromise = null;
function loadMermaid() {
  if (window.mermaid) return Promise.resolve(window.mermaid);
  if (mermaidPromise) return mermaidPromise;
  mermaidPromise = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'console/mermaid.min.js'; // 静态资源挂在 /console/ 前缀下
    s.onload = () => resolve(window.mermaid);
    s.onerror = reject;
    document.head.appendChild(s);
  });
  return mermaidPromise;
}
async function initMermaid() {
  const srcs = document.querySelectorAll('.mermaid-src');
  if (!srcs.length) return;
  try {
    const mermaid = await loadMermaid();
    mermaid.initialize({ startOnLoad: false, theme: 'default', securityLevel: 'strict' });
    let i = 0;
    for (const pre of srcs) {
      const out = pre.parentElement.querySelector('.mermaid-out');
      try {
        const { svg } = await mermaid.render('lm-mermaid-' + (i++), pre.textContent);
        out.innerHTML = svg;
        pre.style.display = 'none';
      } catch { /* 单图失败保留源码 */ }
    }
  } catch {
    // mermaid 加载失败：保留源码展示，不报错
  }
}

// ================================================================ 工具
function esc(s) { return s == null ? '' : String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function trunc(s, n) { s = String(s ?? ''); return s.length > n ? s.slice(0, n) + '…' : s; }
function timeAgo(iso) {
  if (!iso) return '—';
  const m = Math.floor((Date.now() - new Date(iso).getTime()) / 60000);
  if (isNaN(m)) return '—';
  if (m < 1) return '刚刚'; if (m < 60) return `${m} 分钟前`;
  const h = Math.floor(m / 60); if (h < 24) return `${h} 小时前`;
  return `${Math.floor(h / 24)} 天前`;
}
function fmtDate(iso) { if (!iso) return '—'; const d = new Date(iso); return isNaN(d) ? '—' : d.toISOString().slice(0, 10); }
function fmtTime(iso) { if (!iso) return '—'; const d = new Date(iso); return isNaN(d) ? '—' : d.toTimeString().slice(0, 5); }
function toast(msg, isErr) {
  const w = document.getElementById('toasts');
  const t = document.createElement('div');
  t.className = 'toast' + (isErr ? ' err' : '');
  t.textContent = msg;
  w.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity .3s'; setTimeout(() => t.remove(), 320); }, 3200);
}

// ================================================================ 启动
// 本地服务：key 由服务端注入，进入即自动连接；无 key（如直接开文件）则显示重试页。
if (state.apiKey) connect(); else { chrome(); renderConnect(); }
